          </div>
          <button id="curve-reset" class="dl-link inline-flex items-center gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19.5 1.5v4h-4"/><path d="M19.5 5.385A9.98 9.98 0 0 0 12 2C6.477 2 2 6.477 2 12a10 10 0 0 0 5.324 8.842m2.032.805c.843.23 1.729.353 2.644.353c1.3 0 2.544-.248 3.684-.7m1.586-.8a10.05 10.05 0 0 0 3.35-3.428M22 12a10 10 0 0 1-.577 3.356"/></g></svg>Reset</button>
        </div>
        <div class="p-2">
          <canvas id="curve" class="dl-curve rounded border border-border" width="340" height="210"></canvas>
          <div class="mt-1 text-[11px] text-muted-foreground opacity-70">Clique adiciona ponto · duplo-clique remove · arraste para moldar</div>
        </div>
      </div>

      <!-- Brilho -->
      <div class="overflow-hidden rounded border">
        <div class="flex items-center justify-between border-b p-2 text-sm">
          <div class="flex items-center text-muted-foreground">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="m4.5 4.5l2 2m11 0l2-2m0 15l-2-2m-11 0l-2 2M12 1v3m0 16v3M1 12h3m16 0h3M8.5 12a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0"/></svg>
            <span class="ml-2">Brilho</span>
          </div>
          <div class="flex items-center justify-end"><span class="text-primary/50" id="brightness-o">0</span></div>
        </div>
        <div id="brightness-mount"></div>
      </div>

      <!-- Contraste -->
      <div class="overflow-hidden rounded border">
        <div class="flex items-center justify-between border-b p-2 text-sm">
          <div class="flex items-center text-muted-foreground">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M2 6a4 4 0 1 0 8 0a4 4 0 1 0-8 0m12 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M2 18a4 4 0 1 0 8 0a4 4 0 1 0-8 0m12 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/></svg>
            <span class="ml-2">Contraste</span>
          </div>
          <div class="flex items-center justify-end"><span class="text-primary/50" id="contrast-o">0</span></div>
        </div>
        <div id="contrast-mount"></div>
      </div>

      <!-- Escala -->
      <div class="overflow-hidden rounded border">
        <div class="flex items-center justify-between border-b p-2 text-sm">
          <div class="flex items-center text-muted-foreground">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M2 9V2h7m5 12l8 8M2 2l8 8m12 5v7h-7M2 15v7h7m5-12l8-8M2 22l8-8m12-5V2h-7"/></svg>
            <span class="ml-2">Escala</span>
          </div>
          <div class="flex items-center justify-end"><span class="text-primary/50" id="scale-o">10×</span></div>
        </div>
        <div id="scale-mount"></div>
      </div>

      <!-- Pontos de corte -->
      <div class="overflow-hidden rounded border">
        <div class="flex items-center justify-between border-b p-2 text-sm">
          <div class="flex items-center text-muted-foreground">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M2 6a4 4 0 1 0 8 0a4 4 0 1 0-8 0m0 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0m3.5-8l7.5 3.864M22 5.5L5.5 14M23 17h-4m-2 0h-4"/></svg>
            <span class="ml-2">Pontos de corte</span>
          </div>
          <button id="cuts-auto" class="dl-link">Auto</button>
        </div>
        <div id="cuts" class="space-y-1"></div>
      </div>

    </div>

    <!-- RIGHT: canvas stage -->
    <div class="border-border bg-card relative flex min-h-[60vh] w-full items-center justify-center overflow-hidden rounded border lg:min-h-0">
      <canvas id="canvas" class="dl-canvas"></canvas>
    </div>
  </div>

  <script type="module" src="./ditherland.js"></script>
</body>
</html>
